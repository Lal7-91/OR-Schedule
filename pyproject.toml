[project]
name = "or-schedule-harness"
version = "0.1.0"
description = "Learning project: a small multi-agent (LangGraph) harness that solves a toy OR-scheduling problem, in prep for a graduation project on agentic AI harnesses."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
ui = [
    "streamlit>=1.37",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
